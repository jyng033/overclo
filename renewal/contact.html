<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Overclo Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700&family=Source+Serif+4:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./contact.css" />
  </head>
  <body>
    <div class="contact-page">
      <header class="header">
        <a class="brand" href="./index.html" aria-label="Overclo Studio home">
          <img class="brand__mark" src="./re_img/%EB%A1%9C%EA%B3%A0%EB%AA%A8%EC%96%91@300x-8.png" alt="" />
          <span class="brand__name">Overclo Studio</span>
        </a>

        <nav class="nav" aria-label="Main navigation">
          <a href="./about.html">ABOUT</a>
          <a href="./work.html">WORK</a>
          <a class="is-active" href="./contact.html">CONTACT</a>
        </nav>
      </header>

      <main>
        <section class="contact-hero">
          <h1>CONTACT</h1>
          <p>브랜드가 더 분명하게 보이도록 시각적 방향을 설계합니다</p>
        </section>

        <section class="contact-info" aria-label="Contact information">
          <p class="contact-info__lead">
            프로젝트 의뢰 및 견적문의는<br />
            아래 연락처로 연락 바랍니다.
          </p>

          <div class="contact-info__list">
            <p>
              <strong>Phone</strong>
              <a href="tel:01098455101">010-9845-5101</a>
            </p>
            <p>
              <strong>E-mail</strong>
              <a href="mailto:Overclo51@gmail.com">Overclo51@gmail.com</a>
            </p>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          <span>Copyright 2025. </span>
          <strong>Overclo Studio</strong>
          <span> Co. All rights reserved.</span>
        </p>
      </footer>
    </div>
    <div class="custom-cursor"></div>
    <script>
      const c=document.querySelector('.custom-cursor');
      document.addEventListener('mousemove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
      document.addEventListener('mouseleave',()=>c.style.display='none');
      document.addEventListener('mouseenter',()=>c.style.display='');
    </script>
  </body>
</html>
