<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work | Overclo Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Source+Serif+4:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./work.css" />
  </head>
  <body>
    <div class="work-page">
      <header class="header">
        <a class="brand" href="./index.html" aria-label="Overclo Studio home">
          <img class="brand__mark" src="./re_img/%EB%A1%9C%EA%B3%A0%EB%AA%A8%EC%96%91@300x-8.png" alt="" />
          <span class="brand__name">Overclo Studio</span>
        </a>

        <nav class="nav" aria-label="Main navigation">
          <a href="./about.html">ABOUT</a>
          <a class="is-active" href="./work.html">WORK</a>
          <a href="./contact.html">CONTACT</a>
        </nav>
      </header>

      <main>
        <section class="work-hero">
          <h1>WORK</h1>
        </section>

        <section class="work-tabs" aria-label="Work categories">
          <a class="is-active" href="#">WEB DESIGN</a>
          <a href="#">PRODUCT DETAIL PAGE</a>
          <a href="#">BLOG DESIGN</a>
          <a href="#">PACKAGING DESIGN</a>
          <a href="#">COMMERCIAL VIDEO</a>
        </section>

        <section class="work-gallery" aria-label="Work portfolio">
          <img src="https://placehold.co/632x356" alt="Work preview 1" />
          <img src="https://placehold.co/632x356" alt="Work preview 2" />
          <img src="https://placehold.co/632x356" alt="Work preview 3" />
          <img src="https://placehold.co/632x356" alt="Work preview 4" />
          <img src="https://placehold.co/632x356" alt="Work preview 5" />
          <img src="https://placehold.co/632x356" alt="Work preview 6" />
          <img src="https://placehold.co/632x355" alt="Work preview 7" />
          <img src="https://placehold.co/632x356" alt="Work preview 8" />
          <img src="https://placehold.co/632x356" alt="Work preview 9" />
          <img src="https://placehold.co/632x355" alt="Work preview 10" />
          <img src="https://placehold.co/632x355" alt="Work preview 11" />
        </section>
      </main>

      <footer class="site-footer">
        <p>
          <span>Copyright 2025. </span>
          <strong>Overclo Studio</strong>
          <span> Co. All rights reserved.</span>
        </p>
      </footer>
    </div>
    <div class="custom-cursor"></div>
    <script>
      const c=document.querySelector('.custom-cursor');
      document.addEventListener('mousemove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
      document.addEventListener('mouseleave',()=>c.style.display='none');
      document.addEventListener('mouseenter',()=>c.style.display='');
    </script>
  </body>
</html>
