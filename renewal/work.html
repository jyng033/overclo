<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work | Overclo Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Source+Serif+4:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./work.css" />
  </head>
  <body>
    <div class="work-page">
      <header class="header">
        <a class="brand" href="./index.html" aria-label="Overclo Studio home">
          <img class="brand__mark" src="./re_img/%EB%A1%9C%EA%B3%A0%EB%AA%A8%EC%96%91@300x-8.png" alt="" />
          <span class="brand__name">Overclo Studio</span>
        </a>

        <nav class="nav" aria-label="Main navigation">
          <a href="./index.html#why">ABOUT</a>
          <a class="is-active" href="./work.html">WORK</a>
          <a href="./index.html#contact">CONTACT</a>
        </nav>
      </header>

      <main>
        <section class="work-hero">
          <h1>WORK</h1>
        </section>

        <section class="work-tabs" aria-label="Work categories">
          <a class="is-active" data-tab="web" href="#">WEB DESIGN</a>
          <a data-tab="detail" href="#">PRODUCT DETAIL PAGE</a>
          <a data-tab="blog" href="#">BLOG DESIGN</a>
          <a data-tab="packaging" href="#">PACKAGING DESIGN</a>
          <a data-tab="video" href="#">COMMERCIAL VIDEO</a>
        </section>

        <section class="work-gallery" aria-label="Work portfolio">
          <div class="tab-panel is-active" data-panel="web">
            <img src="https://placehold.co/632x356?text=Web+Design+1" alt="Web Design 1" />
            <img src="https://placehold.co/632x356?text=Web+Design+2" alt="Web Design 2" />
            <img src="https://placehold.co/632x356?text=Web+Design+3" alt="Web Design 3" />
            <img src="https://placehold.co/632x356?text=Web+Design+4" alt="Web Design 4" />
            <img src="https://placehold.co/632x356?text=Web+Design+5" alt="Web Design 5" />
            <img src="https://placehold.co/632x356?text=Web+Design+6" alt="Web Design 6" />
          </div>
          <div class="tab-panel" data-panel="detail">
            <img src="https://placehold.co/632x356?text=Detail+Page+1" alt="Detail Page 1" />
            <img src="https://placehold.co/632x356?text=Detail+Page+2" alt="Detail Page 2" />
            <img src="https://placehold.co/632x356?text=Detail+Page+3" alt="Detail Page 3" />
          </div>
          <div class="tab-panel" data-panel="blog">
            <img src="https://placehold.co/632x356?text=Blog+Design+1" alt="Blog Design 1" />
            <img src="https://placehold.co/632x356?text=Blog+Design+2" alt="Blog Design 2" />
            <img src="https://placehold.co/632x356?text=Blog+Design+3" alt="Blog Design 3" />
          </div>
          <div class="tab-panel" data-panel="packaging">
            <img src="https://placehold.co/632x356?text=Packaging+1" alt="Packaging 1" />
            <img src="https://placehold.co/632x356?text=Packaging+2" alt="Packaging 2" />
            <img src="https://placehold.co/632x356?text=Packaging+3" alt="Packaging 3" />
          </div>
          <div class="tab-panel" data-panel="video">
            <img src="https://placehold.co/632x356?text=Video+1" alt="Video 1" />
            <img src="https://placehold.co/632x356?text=Video+2" alt="Video 2" />
            <img src="https://placehold.co/632x356?text=Video+3" alt="Video 3" />
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          <span>Copyright 2025. </span>
          <strong>Overclo Studio</strong>
          <span> Co. All rights reserved.</span>
        </p>
      </footer>
    </div>
    <script>
      document.querySelectorAll('.work-tabs a').forEach(tab => {
        tab.addEventListener('click', e => {
          e.preventDefault();
          document.querySelector('.work-tabs .is-active').classList.remove('is-active');
          tab.classList.add('is-active');
          document.querySelector('.tab-panel.is-active').classList.remove('is-active');
          document.querySelector('[data-panel="' + tab.dataset.tab + '"]').classList.add('is-active');
        });
      });
    </script>
    <div class="custom-cursor"></div>
    <script>
      const c=document.querySelector('.custom-cursor');
      document.addEventListener('mousemove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
      document.addEventListener('mouseleave',()=>c.style.display='none');
      document.addEventListener('mouseenter',()=>c.style.display='');
    </script>
  </body>
</html>
