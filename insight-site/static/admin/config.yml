backend:
  name: github
  repo: jyng033/overclo
  branch: main
  base_url: https://overclo-insight.pages.dev
  auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: "insight-site/static/uploads"
public_folder: "/insight/uploads"
site_url: "https://www.overclo.com/insight"
display_url: "https://www.overclo.com/insight"
locale: "ko"

collections:
  - name: "posts"
    label: "게시글"
    label_singular: "게시글"
    folder: "insight-site/content/posts"
    create: true
    slug: "{{slug}}"
    preview_path: "/insight/{{slug}}/"
    summary: "{{title}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "URL 주소", name: "slug", widget: "string", hint: "영문, 숫자, 하이픈으로 입력하세요. 예: brand-renewal-checklist" }
      - { label: "요약", name: "description", widget: "text", required: false }
      - { label: "발행일", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "수정일", name: "lastmod", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false }
      - { label: "임시저장", name: "draft", widget: "boolean", default: true, hint: "켜져 있으면 실제 사이트에 공개되지 않습니다." }
      - { label: "작성자", name: "author", widget: "string", default: "Overclo" }
      - { label: "대표 이미지", name: "featured_image", widget: "image", required: false }
      - { label: "대표 이미지 설명", name: "featured_image_alt", widget: "string", required: false }
      - { label: "SEO 제목", name: "seo_title", widget: "string", required: false }
      - { label: "SEO 설명", name: "seo_description", widget: "text", required: false }
      - { label: "태그", name: "tags", widget: "list", required: false }
      - label: "GEO 요약"
        name: "geo_summary"
        widget: "text"
        required: false
        hint: "AI 검색과 독자가 빠르게 이해할 수 있도록 글의 핵심 결론을 1~3문장으로 적으세요."
      - label: "핵심 체크리스트"
        name: "key_takeaways"
        widget: "list"
        required: false
        hint: "글의 핵심 내용을 짧은 문장 목록으로 입력하세요."
      - label: "자주 묻는 질문"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "질문", name: "question", widget: "string" }
          - { label: "답변", name: "answer", widget: "text" }
          - { label: "FAQ 이미지", name: "image", widget: "image", required: false }
          - { label: "FAQ 이미지 설명", name: "image_alt", widget: "string", required: false }
      - label: "관련 글"
        name: "related_links"
        widget: "list"
        required: false
        fields:
          - { label: "제목", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string", hint: "내부 글은 /insight/example-slug/ 형식으로 입력하세요." }
      - label: "본문"
        name: "body"
        widget: "markdown"
        hint: "본문은 핵심 내용, 상세 설명, 자주 묻는 질문 순서로 작성하면 AI 검색과 일반 검색에 모두 유리합니다."
        default: |
          ## 핵심 내용

          이 글의 핵심 내용을 구체적으로 작성합니다.

          ## 상세 설명

          독자가 실제로 궁금해할 맥락, 기준, 예시를 함께 정리합니다.

          ## 자주 묻는 질문

          ### 질문을 입력하세요

          답변을 짧고 명확하게 작성합니다.
