<!doctype html>
<html lang="ko">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <header class="header">
      <a class="brand" href="{{ .Site.Params.mainSiteURL }}" aria-label="Overclo Studio home">
        <img class="brand__mark" src="{{ .Site.Params.mainSiteURL }}renewal/re_img/%EB%A1%9C%EA%B3%A0%EB%AA%A8%EC%96%91@300x-8.png" alt="" />
        <span class="brand__name">Overclo Studio</span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="{{ .Site.Params.mainSiteURL }}#why" data-label="회사소개">ABOUT</a>
        <a href="{{ .Site.Params.mainSiteURL }}portfolio" data-label="포트폴리오">PORTFOLIO</a>
        <a href="{{ .Site.Params.mainSiteURL }}insight.html" data-label="인사이트">INSIGHT</a>
        <a href="{{ .Site.Params.mainSiteURL }}#contact" data-label="디자인문의">CONTACT</a>
        <a class="nav__cta" href="https://open.kakao.com/o/sYtrPnxf" target="_blank" rel="noopener">1:1문의</a>
      </nav>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <p>
        <span>Copyright 2025.&nbsp;</span>
        <strong>Overclo Studio</strong>
        <span>&nbsp;Co. All rights reserved.</span>
      </p>
    </footer>
    <a class="floating-kakao" href="https://open.kakao.com/o/sYtrPnxf" target="_blank" rel="noopener" aria-label="카톡문의">
      <span class="floating-kakao__label">카톡문의</span>
      <span class="floating-kakao__icon" aria-hidden="true"></span>
    </a>
  </body>
</html>
