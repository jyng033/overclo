baseURL = "https://www.overclo.com/insight/"
locale = "ko-KR"
title = "Overclo Insight"
enableRobotsTXT = false
disableKinds = ["taxonomy", "term", "section"]
ignoreErrors = ["error-disable-taxonomy"]
summaryLength = 28

[params]
  siteName = "Overclo Insight"
  description = "오버클로의 브랜드, 디자인, 콘텐츠, 비즈니스 운영 관점을 기록하는 인사이트 허브입니다."
  defaultImage = "https://www.overclo.com/renewal/re_img/%EB%8C%80%ED%91%9C1.png"
  mainSiteURL = "https://www.overclo.com/"
  author = "Overclo"

[permalinks]
  posts = "/:slug/"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
